<section class="overflow-hidden rounded-2xl bg-white shadow-sm ring-1 ring-[var(--pale-dogwood)]">
  <header class="border-b border-[var(--pale-dogwood)] bg-[var(--space-cadet)] px-4 py-4">
    <div class="flex items-center gap-3">
      <span class="material-symbols-rounded text-2xl text-[var(--isabelline)]"> mail </span>
      <div>
        <h2 class="text-2xl font-semibold text-[var(--isabelline)]">Posteingang</h2>
      </div>
    </div>
  </header>
  <!-- Messages -->
  @if (enquiries.length === 0) {
    <p class="px-4 py-8 text-center text-[var(--ultra-violet)]">Dein Posteingang ist leer.</p>
  } @else {
    <div class="divide-y divide-[var(--pale-dogwood)]">
      @for (enquiry of enquiries; track $index) {
        <article class="px-4 py-4 transition-colors hover:bg-[var(--isabelline)]">
          <!-- Sender + Date -->
          <div class="flex items-center justify-between gap-4">
            <span class="min-w-0 truncate text-sm font-semibold text-[var(--ultra-violet)]">
              {{ enquiry.sender }}
            </span>
            <time class="shrink-0 text-xs text-[var(--rose-quartz)]">
              {{ enquiry.date }}
            </time>
          </div>
          <!-- Title -->
          <h3 class="mt-2 truncate text-base font-semibold text-[var(--space-cadet)]">
            {{ enquiry.title }}
          </h3>
          <!-- Description -->
          <p class="mt-1 truncate text-sm text-[var(--ultra-violet)]">
            {{ enquiry.message }}
          </p>
        </article>
      }
    </div>
  }
</section>
